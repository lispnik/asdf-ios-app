# asdf-ios-app, on macOS arm64.
#
# ECL and only ECL. This system drives ECL's own C backend -- src/compile.lisp
# binds C::*CC*, C::*CC-FLAGS* and C::*ECL-INCLUDE-DIRECTORY* to point it at an
# iOS SDK -- so there is no C package to bind under any other implementation and
# SBCL cannot get as far as loading it. That is not a portability gap to close:
# the whole point of the system is that ECL is the Lisp that runs on the phone.
#
# No ocicl step, because the system has no dependencies. It shells out to clang,
# codesign, xcrun and plutil, all of which come with Xcode.
#
# A stock `brew install ecl` is enough *here*, which is worth saying because the
# sibling objc repository builds a patched ECL and explains at length why it must.
# Both are true. That patch (RTLD_DEFAULT for the :default module) is what lets
# CFFI resolve symbols in a statically linked image -- a property of the app on
# the phone, not of the machine building it. The builder never needs it, and
# BOOTSTRAP-ECL applies it to the cross-built prefixes itself, from
# tools/patches/.
#
# Three jobs.  The first is the host-side suite: seconds, no toolchain, and it
# covers everything but the part this system is for.  The second is that part:
# it has BOOTSTRAP-ECL cross-build ECL for the simulator -- a host ECL from the
# same tree first, because the cross build reuses its dpp and ecl_min -- boots
# a simulator, and runs the whole suite, including the ten tests that compile,
# link, sign, package and launch a real bundle.  Cold that is twenty minutes;
# the prefixes are cached by the ECL commit they were built from, so it is
# twenty minutes once per ECL revision and a few minutes otherwise.
#
# The third builds every example in examples/ for the simulator, with the
# prefixes the second one cached.  The suite's fixture is one small app; the
# examples are thirty-six real ones against every framework the README lists,
# and four of the last fourteen were broken at their first build with nothing
# here to say so.  Nothing is launched -- a build is what a regression in the
# bridge or the build system breaks, and a launch needs a screenshot to judge.
# The examples are sharded across runners by position in the sorted list, and
# every one in a shard is attempted before the shard reports, so one failure
# names every failure.
#
# The device is not built for.  Signing needs an identity and a profile a
# runner does not have, and there is no phone on the other end of it.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ecl · macos-latest (arm64)
    runs-on: macos-latest
    # The host-only suite is seconds; `brew install ecl` is the only part that
    # takes real time. Loose enough never to fire on a slow runner, tight enough
    # that a hung test is diagnosable rather than a runner that went quiet.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install ECL
        run: brew install ecl

      - name: Report the environment the tests will see
        # Which tests skip is decided entirely by TOOLCHAIN-AVAILABLE-P, so this
        # is what says why the count in this job is 155 and not 177.
        run: |
          ecl --norc \
            --eval '(require :asdf)' \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) (list :tree (merge-pathnames "examples/" (uiop:getcwd))) :inherit-configuration))' \
            --eval '(asdf:load-system :asdf-ios-app)' \
            --eval '(format t "~&ECL ~a on ~a~%" (lisp-implementation-version) (machine-type))' \
            --eval '(asdf-ios-app:describe-toolchain)' \
            --eval '(ext:quit)'

      - name: Run tests
        # examples/ is on the registry because three tests resolve the
        # hello-ios system to check how a real application's components are
        # declared. A bare :directory does not recurse, so without this they
        # skip -- which is how the first run here reported 147 checks rather
        # than 155.
        #
        # ASDF discards what a TEST-OP returns, so the exit code has to come
        # from the perform method signalling -- which it does. A suite that
        # cannot fail the job is a suite that protects nothing.
        run: |
          ecl --norc \
            --eval '(require :asdf)' \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) (list :tree (merge-pathnames "examples/" (uiop:getcwd))) :inherit-configuration))' \
            --eval '(asdf:test-system :asdf-ios-app)' \
            --eval '(ext:quit 0)'

  cross:
    name: ecl · iphonesimulator (cross-built, cached)
    runs-on: macos-latest
    # Twenty minutes when the cache misses, of which the two ECL builds are
    # nearly all; the suite itself, fixture app and simulator launch included,
    # is under five.  Loose enough for a slow runner, tight enough that a
    # hung build is a failure rather than a runner that went quiet.
    timeout-minutes: 90
    env:
      ECL_REPOSITORY: https://github.com/lispnik/ecl.git
      ECL_BRANCH: develop

    steps:
      - uses: actions/checkout@v5

      # The driver.  BOOTSTRAP-ECL is Lisp, in this system, and this system
      # only loads under ECL -- so an ECL is needed to build the ECLs.  A stock
      # one is fine for that: the RTLD_DEFAULT fix matters to the app on the
      # phone, and the prefixes are built from the fork's develop, which has it.
      - name: Install ECL, to drive the build
        run: brew install ecl

      - name: Resolve the ECL branch to a commit
        id: ecl
        run: |
          sha=$(git ls-remote "$ECL_REPOSITORY" "refs/heads/$ECL_BRANCH" | cut -f1)
          test -n "$sha" || { echo "::error::$ECL_REPOSITORY has no branch $ECL_BRANCH" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$ECL_BRANCH is $sha"

      # The prefixes and the record of where they are, and not the source
      # tree or the build directories, which are most of a gigabyte and are
      # only needed to make the prefixes.  The key carries the build script
      # and the patches as well as the commit: any of the three changes what
      # gets built.
      - name: Cache the cross-built ECL
        id: ecl-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/asdf-ios-app/ecl-ios/host
            ~/.cache/asdf-ios-app/ecl-ios/iphonesimulator
            ~/.cache/asdf-ios-app/toolchain.sexp
          key: ecl-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.ecl.outputs.sha }}-${{ hashFiles('tools/build-ecl-ios.sh', 'tools/patches/*') }}

      - name: Cross-build ECL for the simulator
        if: steps.ecl-cache.outputs.cache-hit != 'true'
        run: |
          brew install automake autoconf libtool texinfo
          ecl --norc \
            --eval '(require :asdf)' \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :ignore-inherited-configuration))' \
            --eval '(asdf:load-system :asdf-ios-app)' \
            --eval '(asdf-ios-app:bootstrap-ecl :platforms (list :simulator))' \
            --eval '(ext:quit 0)'

      # The one test that launches the fixture wants a booted simulator and
      # says so.  Any iPhone will do; the newest available runtime is taken so
      # the choice does not go stale with the runner image.
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
                 | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          echo "booting $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices booted

      - name: Report the toolchain the tests will see
        run: |
          ecl --norc \
            --eval '(require :asdf)' \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) (list :tree (merge-pathnames "examples/" (uiop:getcwd))) :ignore-inherited-configuration))' \
            --eval '(asdf:load-system :asdf-ios-app)' \
            --eval '(asdf-ios-app:describe-toolchain)' \
            --eval '(ext:quit)'

      - name: Run tests, with the toolchain and a simulator
        env:
          ASDF_IOS_APP_SIMULATOR_TESTS: "1"
        run: |
          ecl --norc \
            --eval '(require :asdf)' \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) (list :tree (merge-pathnames "examples/" (uiop:getcwd))) :ignore-inherited-configuration))' \
            --eval '(asdf:test-system :asdf-ios-app)' \
            --eval '(ext:quit 0)'

  examples:
    name: examples · iphonesimulator (shard ${{ matrix.shard }} of 4)
    runs-on: macos-latest
    needs: cross
    # Nine examples a shard, each a cross-compile of objc and the example on
    # top of it, three or four minutes apiece on a runner.  Loose enough for
    # a cold Swift toolchain, tight enough that a hung build is a failure.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      ECL_REPOSITORY: https://github.com/lispnik/ecl.git
      ECL_BRANCH: develop
      SHARDS: "4"

    steps:
      - uses: actions/checkout@v5

      # All but four of the examples are written against objc, which lives in
      # its own repository; its ocicl.csv names what it needs, and slynk is
      # what the two live-programming examples add.  Checked out under the
      # workspace so one :tree covers objc, its dependencies, and slynk.
      - name: Check out objc
        uses: actions/checkout@v5
        with:
          repository: lispnik/objc
          path: objc-src

      - name: Install ECL, to drive the build
        run: brew install ecl

      - name: Resolve the ECL branch to a commit
        id: ecl
        run: |
          sha=$(git ls-remote "$ECL_REPOSITORY" "refs/heads/$ECL_BRANCH" | cut -f1)
          test -n "$sha" || { echo "::error::$ECL_REPOSITORY has no branch $ECL_BRANCH" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The same key the cross job saved under; that job ran first, so a
      # miss here is a bug in the key, not a cold cache, and is reported as
      # one rather than spending twenty minutes rebuilding.
      - name: Restore the cross-built ECL
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/asdf-ios-app/ecl-ios/host
            ~/.cache/asdf-ios-app/ecl-ios/iphonesimulator
            ~/.cache/asdf-ios-app/toolchain.sexp
          key: ecl-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.ecl.outputs.sha }}-${{ hashFiles('tools/build-ecl-ios.sh', 'tools/patches/*') }}
          fail-on-cache-miss: true

      # ocicl's installer is an SBCL program, but what it produces is a
      # directory of source.  So it is installed with SBCL and used from ECL,
      # exactly as objc's own CI does.
      - name: Install SBCL, for ocicl only
        run: brew install sbcl

      - name: Install ocicl and objc's dependencies
        working-directory: objc-src
        run: |
          git clone --depth 1 https://github.com/ocicl/ocicl.git "$HOME/ocicl-src"
          ( cd "$HOME/ocicl-src" && sbcl --non-interactive --load setup.lisp )
          export PATH="$HOME/.local/bin:$PATH"
          ocicl setup
          # ocicl exits 0 when a download fails and ghcr.io fails often
          # enough to matter, so: several attempts, and a failure here, on
          # the line that names the package, rather than two steps later as
          # "Component not found".
          for attempt in 1 2 3 4 5; do
            ocicl install 2>&1 | tee ocicl-install.log
            ocicl install slynk 2>&1 | tee -a ocicl-install.log
            if ! grep -q "failed to install" ocicl-install.log; then
              break
            fi
            echo "::warning::ocicl install attempt $attempt did not get every package"
            sleep 30
          done
          if grep -q "failed to install" ocicl-install.log; then
            echo "::error::ocicl could not install every dependency after 5 attempts" >&2
            exit 1
          fi

      - name: Report the toolchain the builds will see
        run: |
          ecl --norc \
            --eval '(require :asdf)' \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :ignore-inherited-configuration))' \
            --eval '(asdf:load-system :asdf-ios-app)' \
            --eval '(asdf-ios-app:describe-toolchain)' \
            --eval '(ext:quit)'

      # The systems to build are the .asd files that declare :ios-app-system
      # -- the directory name is not always the system name (hello/ holds
      # hello-ios) -- sorted, and this shard takes every fourth.  Each is a
      # fresh ECL, so one example's failure cannot leak into the next, and
      # every failure is reported before the shard exits non-zero.
      - name: Build this shard's examples
        run: |
          i=0; failed=""
          for asd in $(grep -l "ios-app-system" examples/*/*.asd | sort); do
            if [ $((i % SHARDS)) -eq "${{ matrix.shard }}" ]; then
              name=$(basename "$asd" .asd)
              echo "::group::$name"
              if ecl --norc \
                   --eval '(require :asdf)' \
                   --eval '(asdf:initialize-source-registry (list :source-registry (list :tree (uiop:getcwd)) :ignore-inherited-configuration))' \
                   --eval '(handler-bind ((warning (function muffle-warning))) (asdf:load-system :asdf-ios-app))' \
                   --eval "(handler-bind ((warning (function muffle-warning))) (asdf:make \"$name\"))" \
                   --eval '(ext:quit 0)'; then
                echo "built $name"
              else
                echo "::error::$name did not build"
                failed="$failed $name"
              fi
              echo "::endgroup::"
            fi
            i=$((i + 1))
          done
          if [ -n "$failed" ]; then
            echo "::error::did not build:$failed" >&2
            exit 1
          fi
